<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#15803d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="สมุดเงินทอง" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.json" />
    
    <title>สมุดเงินทอง - บันทึกรายรับรายจ่ายง่ายๆ สำหรับผู้สูงวัย</title>
    
    <!-- Google Fonts: Prompt & Sarabun for optimal Thai legibility -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Instant Root Font Scale to avoid layout flicker -->
    <script>
      (function() {
        try {
          var fs = localStorage.getItem('banchee_font_size') || 'normal';
          var scale = fs === 'huge' ? 1.36 : (fs === 'large' ? 1.18 : 1.0);
          document.documentElement.style.fontSize = (16 * scale) + 'px';
          document.documentElement.setAttribute('data-font-size', fs);
          document.documentElement.style.setProperty('--app-font-scale', String(scale));
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8F7F4] text-[#2D2A26] selection:bg-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
